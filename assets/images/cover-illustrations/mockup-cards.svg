<svg viewBox="0 0 450 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Card grid - 2x3 arrangement with slight rotations -->

  <!-- Card 1 (top-left) -->
  <g transform="translate(20, 20) rotate(-2, 90, 70)">
    <rect x="0" y="0" width="180" height="140" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="0" y="0" width="180" height="140" rx="10" fill="url(#card-shadow)" opacity="0.3"/>
    <!-- Image placeholder -->
    <rect x="12" y="12" width="156" height="70" rx="6" fill="#F3F4F6"/>
    <circle cx="45" cy="47" r="15" fill="#F97316" opacity="0.6"/>
    <rect x="70" y="35" width="80" height="6" rx="2" fill="#D1D5DB"/>
    <rect x="70" y="47" width="60" height="4" rx="2" fill="#E5E7EB"/>
    <!-- Text lines -->
    <rect x="12" y="92" width="120" height="6" rx="2" fill="#374151" opacity="0.7"/>
    <rect x="12" y="104" width="90" height="4" rx="2" fill="#9CA3AF" opacity="0.5"/>
    <rect x="12" y="114" width="100" height="4" rx="2" fill="#9CA3AF" opacity="0.4"/>
    <!-- Accent badge -->
    <rect x="120" y="118" width="48" height="16" rx="8" fill="#F97316" opacity="0.15"/>
    <rect x="128" y="123" width="32" height="6" rx="3" fill="#F97316" opacity="0.5"/>
  </g>

  <!-- Card 2 (top-right) -->
  <g transform="translate(230, 10) rotate(1, 90, 70)">
    <rect x="0" y="0" width="180" height="140" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="0" y="0" width="180" height="140" rx="10" fill="url(#card-shadow)" opacity="0.2"/>
    <!-- Color blocks -->
    <rect x="12" y="12" width="50" height="50" rx="8" fill="#C2410C" opacity="0.2"/>
    <rect x="68" y="12" width="50" height="50" rx="8" fill="#EA580C" opacity="0.15"/>
    <rect x="124" y="12" width="44" height="50" rx="8" fill="#FB923C" opacity="0.2"/>
    <!-- Icon shapes inside -->
    <circle cx="37" cy="37" r="12" fill="#C2410C" opacity="0.4"/>
    <rect x="80" y="25" width="26" height="26" rx="4" fill="#EA580C" opacity="0.3"/>
    <polygon points="146,25 158,50 134,50" fill="#FB923C" opacity="0.4"/>
    <!-- Text -->
    <rect x="12" y="72" width="130" height="6" rx="2" fill="#374151" opacity="0.7"/>
    <rect x="12" y="84" width="100" height="4" rx="2" fill="#9CA3AF" opacity="0.5"/>
    <rect x="12" y="94" width="110" height="4" rx="2" fill="#9CA3AF" opacity="0.4"/>
    <!-- Rating stars -->
    <polygon points="14,114 16,120 22,120 17,124 19,130 14,126 9,130 11,124 6,120 12,120" fill="#F59E0B" opacity="0.6"/>
    <polygon points="30,114 32,120 38,120 33,124 35,130 30,126 25,130 27,124 22,120 28,120" fill="#F59E0B" opacity="0.6"/>
    <polygon points="46,114 48,120 54,120 49,124 51,130 46,126 41,130 43,124 38,120 44,120" fill="#F59E0B" opacity="0.6"/>
  </g>

  <!-- Card 3 (middle-left) -->
  <g transform="translate(30, 180) rotate(1, 90, 70)">
    <rect x="0" y="0" width="180" height="120" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Circular progress -->
    <circle cx="50" cy="50" r="30" fill="none" stroke="#F3F4F6" stroke-width="6"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#F97316" stroke-width="6" stroke-dasharray="130 188" stroke-linecap="round" transform="rotate(-90 50 50)"/>
    <text x="50" y="55" font-size="14" font-weight="700" fill="#C2410C" text-anchor="middle" font-family="sans-serif">72%</text>
    <!-- Stats -->
    <rect x="100" y="25" width="60" height="6" rx="2" fill="#374151" opacity="0.6"/>
    <rect x="100" y="37" width="45" height="4" rx="2" fill="#9CA3AF" opacity="0.5"/>
    <rect x="100" y="50" width="68" height="14" rx="4" fill="#C2410C" opacity="0.1"/>
    <rect x="108" y="54" width="50" height="6" rx="3" fill="#C2410C" opacity="0.4"/>
    <!-- Bottom bar -->
    <rect x="12" y="90" width="156" height="4" rx="2" fill="#F3F4F6"/>
    <rect x="12" y="90" width="100" height="4" rx="2" fill="#FB923C" opacity="0.5"/>
    <rect x="12" y="100" width="80" height="4" rx="2" fill="#9CA3AF" opacity="0.3"/>
  </g>

  <!-- Card 4 (middle-right) -->
  <g transform="translate(240, 170) rotate(-1, 90, 70)">
    <rect x="0" y="0" width="180" height="120" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Mini chart -->
    <rect x="15" y="55" width="14" height="40" rx="3" fill="#FDBA74" opacity="0.6"/>
    <rect x="35" y="35" width="14" height="60" rx="3" fill="#FB923C" opacity="0.7"/>
    <rect x="55" y="45" width="14" height="50" rx="3" fill="#F97316" opacity="0.6"/>
    <rect x="75" y="25" width="14" height="70" rx="3" fill="#EA580C" opacity="0.7"/>
    <rect x="95" y="40" width="14" height="55" rx="3" fill="#C2410C" opacity="0.6"/>
    <!-- Trend line -->
    <polyline points="22,50 42,30 62,40 82,20 102,35" stroke="#C2410C" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="22" cy="50" r="3" fill="#C2410C" opacity="0.8"/>
    <circle cx="42" cy="30" r="3" fill="#C2410C" opacity="0.8"/>
    <circle cx="62" cy="40" r="3" fill="#C2410C" opacity="0.8"/>
    <circle cx="82" cy="20" r="3" fill="#C2410C" opacity="0.8"/>
    <circle cx="102" cy="35" r="3" fill="#C2410C" opacity="0.8"/>
    <!-- Label -->
    <rect x="120" y="20" width="48" height="24" rx="6" fill="#F97316" opacity="0.1"/>
    <rect x="128" y="27" width="32" height="4" rx="2" fill="#F97316" opacity="0.5"/>
    <rect x="128" y="35" width="24" height="3" rx="1" fill="#F97316" opacity="0.3"/>
    <!-- Bottom text -->
    <rect x="15" y="102" width="100" height="5" rx="2" fill="#374151" opacity="0.5"/>
  </g>

  <!-- Card 5 (bottom, spanning) -->
  <g transform="translate(60, 320) rotate(0.5, 160, 40)">
    <rect x="0" y="0" width="320" height="70" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Avatars -->
    <circle cx="30" cy="35" r="18" fill="#FED7AA"/>
    <circle cx="30" cy="30" r="8" fill="#FDBA74"/>
    <path d="M 14 48 Q 30 38 46 48" fill="#FDBA74"/>
    <circle cx="60" cy="35" r="18" fill="#BFDBFE"/>
    <circle cx="60" cy="30" r="8" fill="#93C5FD"/>
    <path d="M 44 48 Q 60 38 76 48" fill="#93C5FD"/>
    <circle cx="90" cy="35" r="18" fill="#C4B5FD"/>
    <circle cx="90" cy="30" r="8" fill="#A78BFA"/>
    <path d="M 74 48 Q 90 38 106 48" fill="#A78BFA"/>
    <!-- Text content -->
    <rect x="120" y="18" width="140" height="7" rx="2" fill="#374151" opacity="0.6"/>
    <rect x="120" y="30" width="100" height="5" rx="2" fill="#9CA3AF" opacity="0.5"/>
    <rect x="120" y="42" width="120" height="5" rx="2" fill="#9CA3AF" opacity="0.4"/>
    <!-- Button -->
    <rect x="260" y="22" width="48" height="26" rx="13" fill="#F97316" opacity="0.8"/>
    <rect x="270" y="32" width="28" height="6" rx="3" fill="white" opacity="0.8"/>
  </g>

  <!-- Floating decorative elements -->
  <circle cx="10" cy="150" r="6" fill="#F97316" opacity="0.2"/>
  <circle cx="440" cy="140" r="8" fill="#FB923C" opacity="0.15"/>
  <rect x="420" y="360" width="20" height="20" rx="4" fill="#FDBA74" opacity="0.2" transform="rotate(15 430 370)"/>
</svg>
