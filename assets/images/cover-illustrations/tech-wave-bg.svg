<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wave-grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="wave-grad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Flowing wave curves -->
  <path d="M 0 200 Q 100 150 200 200 T 400 200" stroke="url(#wave-grad1)" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 0 220 Q 100 170 200 220 T 400 220" stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 0 240 Q 100 190 200 240 T 400 240" stroke="url(#wave-grad2)" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M 0 260 Q 100 210 200 260 T 400 260" stroke="#93C5FD" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Abstract light particles -->
  <circle cx="80" cy="180" r="4" fill="#06B6D4" opacity="0.6"/>
  <circle cx="150" cy="160" r="6" fill="#3B82F6" opacity="0.5"/>
  <circle cx="220" cy="190" r="3" fill="#60A5FA" opacity="0.7"/>
  <circle cx="280" cy="170" r="5" fill="#0EA5E9" opacity="0.4"/>
  <circle cx="340" cy="200" r="4" fill="#93C5FD" opacity="0.6"/>

  <!-- Glowing dots -->
  <circle cx="100" cy="100" r="8" fill="#06B6D4" opacity="0.3"/>
  <circle cx="100" cy="100" r="4" fill="#06B6D4" opacity="0.6"/>
  <circle cx="300" cy="120" r="10" fill="#3B82F6" opacity="0.2"/>
  <circle cx="300" cy="120" r="5" fill="#3B82F6" opacity="0.5"/>
  <circle cx="200" cy="80" r="6" fill="#60A5FA" opacity="0.4"/>

  <!-- Light streaks -->
  <line x1="50" y1="50" x2="80" y2="70" stroke="#06B6D4" stroke-width="2" opacity="0.4"/>
  <line x1="320" y1="60" x2="350" y2="80" stroke="#3B82F6" stroke-width="2" opacity="0.3"/>
  <line x1="180" y1="320" x2="210" y2="340" stroke="#60A5FA" stroke-width="2" opacity="0.4"/>

  <!-- Abstract geometric shapes -->
  <rect x="60" y="280" width="30" height="30" rx="4" fill="#0EA5E9" opacity="0.2" transform="rotate(15 75 295)"/>
  <rect x="310" y="300" width="40" height="40" rx="6" fill="#2563EB" opacity="0.15" transform="rotate(-20 330 320)"/>
  <polygon points="200,300 220,340 180,340" fill="#3B82F6" opacity="0.2"/>

  <!-- More wave layers -->
  <path d="M 0 300 Q 100 270 200 300 T 400 300" stroke="#60A5FA" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M 0 320 Q 100 290 200 320 T 400 320" stroke="#93C5FD" stroke-width="2" fill="none" opacity="0.25"/>
  <path d="M 0 340 Q 100 310 200 340 T 400 340" stroke="#0EA5E9" stroke-width="1" fill="none" opacity="0.35"/>
</svg>
