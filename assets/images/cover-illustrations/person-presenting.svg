<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="board-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="person-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Presentation board/screen -->
  <g transform="translate(250, 40)">
    <!-- Board frame -->
    <rect x="0" y="0" width="200" height="150" rx="8" fill="url(#board-grad)" stroke="#3B82F6" stroke-width="2"/>
    <!-- Board inner screen -->
    <rect x="10" y="10" width="180" height="120" rx="4" fill="#0F172A"/>
    <!-- Board stand -->
    <line x1="100" y1="150" x2="100" y2="180" stroke="#475569" stroke-width="3"/>
    <line x1="70" y1="180" x2="130" y2="180" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

    <!-- UI elements on board -->
    <!-- Top bar -->
    <rect x="20" y="20" width="160" height="8" rx="2" fill="#1E3A5F"/>
    <circle cx="30" cy="24" r="2.5" fill="#EF4444" opacity="0.8"/>
    <circle cx="38" cy="24" r="2.5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="46" cy="24" r="2.5" fill="#22C55E" opacity="0.8"/>

    <!-- Card elements -->
    <rect x="20" y="35" width="70" height="40" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <rect x="25" y="40" width="30" height="4" rx="1" fill="#60A5FA" opacity="0.6"/>
    <rect x="25" y="48" width="50" height="3" rx="1" fill="#475569" opacity="0.5"/>
    <rect x="25" y="54" width="40" height="3" rx="1" fill="#475569" opacity="0.4"/>
    <rect x="25" y="62" width="20" height="8" rx="2" fill="#3B82F6" opacity="0.7"/>

    <rect x="100" y="35" width="80" height="40" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <!-- Mini chart in card -->
    <rect x="108" y="50" width="8" height="18" fill="#34D399" opacity="0.6"/>
    <rect x="120" y="44" width="8" height="24" fill="#60A5FA" opacity="0.6"/>
    <rect x="132" y="48" width="8" height="20" fill="#818CF8" opacity="0.6"/>
    <rect x="144" y="40" width="8" height="28" fill="#F472B6" opacity="0.6"/>
    <rect x="156" y="46" width="8" height="22" fill="#38BDF8" opacity="0.6"/>
    <rect x="108" y="40" width="25" height="4" rx="1" fill="#94A3B8" opacity="0.5"/>

    <!-- Bottom section -->
    <rect x="20" y="82" width="160" height="40" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <!-- Flow arrows -->
    <rect x="30" y="92" width="30" height="20" rx="3" fill="#4F46E5" opacity="0.5"/>
    <polygon points="68,102 78,97 78,107" fill="#60A5FA" opacity="0.6"/>
    <rect x="85" y="92" width="30" height="20" rx="3" fill="#7C3AED" opacity="0.5"/>
    <polygon points="123,102 133,97 133,107" fill="#A78BFA" opacity="0.6"/>
    <rect x="140" y="92" width="30" height="20" rx="3" fill="#EC4899" opacity="0.5"/>
  </g>

  <!-- Person figure (standing, presenting) -->
  <g transform="translate(130, 100)">
    <!-- Head -->
    <circle cx="40" cy="20" r="20" fill="#FBBF24"/>
    <!-- Eyes -->
    <circle cx="34" cy="17" r="2.5" fill="#1E293B"/>
    <circle cx="46" cy="17" r="2.5" fill="#1E293B"/>
    <!-- Smile -->
    <path d="M 34 25 Q 40 30 46 25" stroke="#1E293B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M 20 15 Q 22 0 40 0 Q 58 0 60 15" fill="#92400E" opacity="0.8"/>

    <!-- Body -->
    <path d="M 25 40 L 20 100 L 30 100 L 35 65 L 45 65 L 50 100 L 60 100 L 55 40 Z" fill="url(#person-body)"/>

    <!-- Arms -->
    <!-- Left arm pointing at board -->
    <path d="M 25 45 L -10 30 L -5 25 L 28 40" fill="#FBBF24"/>
    <!-- Pointer stick -->
    <line x1="-10" y1="28" x2="110" y2="-10" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="110" cy="-10" r="3" fill="#EF4444" opacity="0.8"/>

    <!-- Right arm down -->
    <path d="M 55 45 L 65 80 L 60 82 L 52 50" fill="#FBBF24"/>

    <!-- Legs -->
    <rect x="22" y="100" width="10" height="40" rx="3" fill="#1E293B"/>
    <rect x="48" y="100" width="10" height="40" rx="3" fill="#1E293B"/>
    <!-- Shoes -->
    <rect x="18" y="136" width="18" height="8" rx="4" fill="#374151"/>
    <rect x="44" y="136" width="18" height="8" rx="4" fill="#374151"/>
  </g>

  <!-- Floating UI elements / decorations -->
  <!-- Arrows -->
  <path d="M 80 60 L 100 50 L 95 55 L 110 55 L 110 65 L 95 65 L 100 70 Z" fill="#60A5FA" opacity="0.3"/>

  <!-- Stars / sparkles -->
  <polygon points="470,50 473,58 481,58 475,63 477,71 470,66 463,71 465,63 459,58 467,58" fill="#FBBF24" opacity="0.4"/>
  <polygon points="480,300 482,306 488,306 483,310 485,316 480,312 475,316 477,310 472,306 478,306" fill="#60A5FA" opacity="0.3"/>

  <!-- Dots pattern -->
  <circle cx="50" cy="50" r="2" fill="#6366F1" opacity="0.3"/>
  <circle cx="65" cy="45" r="2" fill="#6366F1" opacity="0.25"/>
  <circle cx="80" cy="50" r="2" fill="#6366F1" opacity="0.2"/>
  <circle cx="50" cy="65" r="2" fill="#6366F1" opacity="0.25"/>
  <circle cx="65" cy="60" r="2" fill="#6366F1" opacity="0.2"/>

  <!-- Abstract chart floating -->
  <g transform="translate(420, 180)" opacity="0.4">
    <rect x="0" y="20" width="10" height="30" rx="2" fill="#60A5FA"/>
    <rect x="14" y="10" width="10" height="40" rx="2" fill="#38BDF8"/>
    <rect x="28" y="25" width="10" height="25" rx="2" fill="#818CF8"/>
    <rect x="42" y="5" width="10" height="45" rx="2" fill="#34D399"/>
  </g>

  <!-- Gear icon -->
  <g transform="translate(60, 320)" opacity="0.25">
    <circle cx="15" cy="15" r="10" fill="none" stroke="#6366F1" stroke-width="2"/>
    <circle cx="15" cy="15" r="4" fill="#6366F1"/>
    <line x1="15" y1="0" x2="15" y2="5" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="25" x2="15" y2="30" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="15" x2="5" y2="15" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="15" x2="30" y2="15" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
