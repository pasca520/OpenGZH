# OpenGZH vhost（http 层 include，log_format 需在此层）
log_format opengzh '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name opengzh.pasca.fun;
    return 301 https://$host$request_uri;
}

# HTTPS 站点
server {
    listen 443 ssl;
    server_name opengzh.pasca.fun;

    ssl_certificate /etc/letsencrypt/live/ev.pasca.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ev.pasca.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/opengzh;
    index index.html;

    # ---- 访问统计（GoAccess）----
    access_log /www/wwwlogs/opengzh.pasca.fun.log opengzh;

    location /.well-known/acme-challenge/ {
        root /opt/opengzh;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 统计登录引导页（公开，不含敏感数据）
    location = /stats-welcome {
        default_type text/html;
        alias /www/wwwstats/welcome.html;
    }
    location = /stats {
        return 301 /stats/;
    }

    # 流量统计报告（basic auth 保护，目录在站点根目录外，rsync 部署不覆盖）
    location ^~ /stats/ {
        alias /www/wwwstats/opengzh/;
        index index.html;
        auth_basic "OpenGZH 访问统计 · 账号 stats";
        auth_basic_user_file /www/wwwstats/.htpasswd;
        add_header Cache-Control "no-cache, no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
