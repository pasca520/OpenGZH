# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name opengzh.pasca.fun;
    return 301 https://$host$request_uri;
}

# HTTPS 站点
server {
    listen 443 ssl;
    server_name opengzh.pasca.fun;

    ssl_certificate /etc/letsencrypt/live/ev.pasca.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ev.pasca.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/opengzh;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /opt/opengzh;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
