name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: npm ci && npm test

      - name: Prepare staging directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: mkdir -p /opt/opengzh-staging

      - name: Package release
        run: |
          archive="/tmp/release-${{ github.sha }}.tar.gz"
          tar -czf "$archive" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='docs' \
            --exclude='deploy' \
            --exclude='assets/fonts' \
            --exclude='.claude' \
            --exclude='node_modules' \
            --exclude='.superpowers' \
            --exclude='design-previews' \
            --exclude='social-card-*' \
            --exclude='social-video-*' \
            .
          cp "$archive" "release-${{ github.sha }}.tar.gz"

      - name: Upload release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: release-${{ github.sha }}.tar.gz
          target: /opt/opengzh-staging

      - name: Promote staged release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            release_dir="/opt/opengzh-staging/${{ github.sha }}"
            archive="/opt/opengzh-staging/release-${{ github.sha }}.tar.gz"
            rm -rf "$release_dir"
            mkdir -p "$release_dir"
            tar -xzf "$archive" -C "$release_dir"
            test -f "$release_dir/index.html"
            rsync -a --delete \
              --exclude='index.html' \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='.gitignore' \
              --exclude='docs' \
              --exclude='deploy' \
              --exclude='assets/fonts' \
              --exclude='.claude' \
              --exclude='node_modules' \
              --exclude='.superpowers' \
              --exclude='design-previews' \
              --exclude='social-card-*' \
              --exclude='social-video-*' \
              "$release_dir/" /opt/opengzh/
            install -m 0644 "$release_dir/index.html" /opt/opengzh/index.html
            rm -rf "$release_dir" "$archive"

      - name: Reload nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /usr/bin/nginx -t && /etc/init.d/nginx reload
