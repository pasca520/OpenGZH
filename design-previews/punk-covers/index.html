<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>Punk Cover 复刻 · 公众号封面（2.35:1）· OpenGZH</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#14171c; --panel2:#1b1f26; --panel3:#222731; --line:#2b313c;
    --text:#f1f3f5; --muted:#98a2b0; --accent:#ffd84d; --accent-soft:rgba(255,216,77,.12);
    --canvas-shadow:0 28px 80px rgba(0,0,0,.52);

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;letter-spacing:.01em}
  button,input,select,textarea{font:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  header{display:flex;align-items:center;gap:18px;min-height:68px;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(13,15,18,.92);backdrop-filter:blur(14px);z-index:20}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--accent);color:#171717;font:900 15px/1 ui-monospace,Menlo,monospace;box-shadow:0 7px 20px rgba(255,216,77,.18)}
  .brand-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
  header h1{font-size:15px;font-weight:680;white-space:nowrap}
  header .sub{font-size:11px;color:var(--muted);white-space:nowrap}
  header .spacer{flex:1}
  .header-meta{display:flex;align-items:center;gap:7px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12px;border-radius:9px;padding:8px 13px;cursor:pointer;transition:border-color .15s,color .15s,background .15s,filter .15s}
  .btn:hover{border-color:#596273;background:var(--panel3)}
  .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .btn:disabled{cursor:wait;opacity:.65}
  .btn.primary{background:var(--accent);color:#171717;border-color:var(--accent);font-weight:700;padding-inline:16px}
  .btn.primary:hover{filter:brightness(1.08)}
  .layout{display:grid;grid-template-columns:270px minmax(460px,1fr) 320px;align-items:stretch;height:calc(100vh - 68px);min-height:0}
  /* 左侧风格列表 */
  .sidebar{min-width:0;border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 24px;background:var(--panel)}
  .sidebar-head{position:sticky;top:-14px;z-index:4;background:linear-gradient(var(--panel) 85%,rgba(20,23,28,0));padding:14px 2px 12px}
  .sidebar-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}
  .sidebar-title strong{font-size:13px}
  .sidebar-title span{font-size:11px;color:var(--muted)}
  .search{position:relative}
  .search input{width:100%;height:36px;padding:7px 10px 7px 32px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font-size:12px;outline:none}
  .search::before{content:'⌕';position:absolute;left:11px;top:8px;color:var(--muted);font-size:15px;transform:rotate(-20deg)}

  .style-item{display:grid;grid-template-columns:70px minmax(0,1fr);align-items:center;gap:10px;width:100%;padding:7px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:5px;background:transparent;color:inherit;text-align:left;transition:background .12s,border-color .12s,transform .12s}
  .style-item:hover{background:var(--panel2);transform:translateX(1px)}
  .style-item.active{background:var(--accent-soft);border-color:rgba(255,216,77,.72)}
  .style-thumb{width:70px;aspect-ratio:1200/510;border-radius:5px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.28)}
  .style-thumb svg{display:block;width:100%;height:100%}
  .style-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
  .style-item .name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .style-item .en{font-size:9px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty-state{padding:28px 10px;color:var(--muted);font-size:12px;text-align:center;line-height:1.7}

  .stage{min-width:0;display:flex;flex-direction:column;align-items:center;padding:24px clamp(18px,3vw,42px) 42px;overflow-y:auto;background:radial-gradient(circle at 50% 24%,#171b22 0,var(--bg) 48%)}
  .preview-wrap{width:100%;max-width:1100px}
  .stage-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px}
  .stage-title{min-width:0}
  .eyebrow{font:650 10px/1.2 ui-monospace,Menlo,monospace;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
  .stage-title h2{font-size:19px;font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stage-tools{display:flex;gap:8px;flex-shrink:0}

  .preview-frame svg{display:block;width:100%;height:auto}

  .size-hint{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;font-size:11px;color:var(--muted)}
  .meta-group{display:flex;flex-wrap:wrap;gap:6px}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .badge.rec{color:var(--accent);border-color:rgba(255,216,77,.6);background:var(--accent-soft)}
  .stage-note{margin-top:28px;width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

  .note-item strong{display:block;font-size:11px;margin-bottom:4px}

  .editor-head{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line)}

  .editor-head h2{font-size:17px;margin-bottom:5px}
  .editor-head p{font-size:11px;color:var(--muted);line-height:1.55}
  .editor h3{font-size:10px;color:var(--muted);font-weight:650;letter-spacing:.1em;margin:18px 0 10px;text-transform:uppercase}
  .editor h3:first-child{margin-top:0}
  .field{margin-bottom:14px}
  .field-label{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
  .field label{font-size:11px;color:#c3c9d2}
  .char-count{font:10px/1.4 ui-monospace,Menlo,monospace;color:#697383}
  .field input,.field select,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font-size:12px;outline:none;transition:border .15s,background .15s;resize:vertical}
  .field textarea{min-height:62px;line-height:1.55}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:#6c7687;background:var(--panel3)}
  .field .hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
  .tips{padding:12px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;font-size:11px;color:var(--muted);line-height:1.7}
  .tips strong{color:var(--text);font-weight:600}
  /* 滚条 */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}
  @media (max-width:1240px){
    .layout{grid-template-columns:230px minmax(400px,1fr) 290px}
    .style-item{grid-template-columns:58px minmax(0,1fr)}
    .style-thumb{width:58px}
    .header-meta .badge:nth-child(2){display:none}

  @media (max-width:980px){
    header{position:relative;flex-wrap:wrap}.header-meta{display:none}header .spacer{display:none}
    .layout{display:block;height:auto;min-height:0}.sidebar,.editor{border:0;border-bottom:1px solid var(--line)}
    .sidebar{max-height:310px}.sidebar-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 8px}

    header .spacer{display:block}.btn{flex:1}.layout{min-height:0}.sidebar-list{grid-template-columns:1fr}.stage{padding-inline:12px}
    .stage-head{align-items:flex-start}.stage-tools .btn{font-size:0;min-width:38px}.stage-tools .btn::after{content:'安全区';font-size:11px}
    .stage-note{grid-template-columns:1fr}.size-hint{align-items:flex-start;flex-direction:column}.editor{padding:16px 14px}
  }
</style>

<header>

<script>
'use strict';
/* ============================================================
 * 工具函数（与 OpenGZH assets/scripts/cover 体系保持一致）
 * ============================================================ */
const FONT = "'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif";
const SERIF = "'Noto Serif SC','Source Han Serif SC','SimSun',serif";

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function textW(text, fontSize, letterSpacing=0){
  if(!text) return 0;
  let w = 0;
  for(const ch of text){
    if(ch === '\n') continue;
    w += (ch.codePointAt(0) > 0x2E7F ? fontSize : fontSize * 0.58) + letterSpacing;
  }
  return Math.ceil(w);
}

/** CJK 感知换行，返回带 \n 的文本 */
function wrapText(text, fontSize, maxWidth, letterSpacing=0){
  if(!text) return '';
  const lines = [];
  for(const para of String(text).split('\n')){
    if(para === ''){ lines.push(''); continue; }
    let line = '';
    for(const ch of para){
      const chW = (ch.codePointAt(0) > 0x2E7F ? fontSize : fontSize * 0.58) + letterSpacing;
      if(line && textW(line, fontSize, letterSpacing) + chW > maxWidth){
        const sp = line.lastIndexOf(' ');
        if(sp > 0){ lines.push(line.slice(0,sp)); line = line.slice(sp+1)+ch; }
        else { lines.push(line); line = ch; }
      } else { line += ch; }
    }
    lines.push(line);
  }
  return lines.join('\n');
}

/** 渲染多行 SVG <text> */
function renderTextLines(text, x, y, fontSize, lineHeight, letterSpacing, align, fill, weight, family, extra=''){
  if(!text) return '';
  const lh = lineHeight <= 4 ? fontSize * lineHeight : lineHeight;
  const anchor = align === 'center' ? 'middle' : align === 'right' ? 'end' : 'start';
  return String(text).split('\n').map((line,i)=>{
    return `<text x="${x}" y="${y + i*lh}" font-size="${fontSize}" font-weight="${weight||'normal'}" font-family="${family||FONT}" fill="${fill}" text-anchor="${anchor}" letter-spacing="${letterSpacing||0}"${extra}>${esc(line)}</text>`;
  }).join('\n');
}

/**
 * ponytail: 单文件预览页的最小自适应排版。按估算字宽换行并递减字号，
 * 上限是中英文常规标题；若后续需要复杂排版，应升级为真实 SVG getBBox 布局器。
 */
function fitTextBlock(text, {
  x, y, maxWidth, maxLines=2, fontSize, minFontSize=22, lineHeight=1.15,
  letterSpacing=0, align='left', fill='#111', weight=600, family=FONT, extra=''
}){
  if(!text) return '';
  let size = fontSize;
  let wrapped = wrapText(String(text), size, maxWidth, letterSpacing);
  while(size > minFontSize && wrapped.split('\n').length > maxLines){
    size -= 2;
    wrapped = wrapText(String(text), size, maxWidth, letterSpacing);
  }
  return renderTextLines(wrapped, x, y, size, lineHeight, letterSpacing, align, fill, weight, family, extra);
}

function seededRandom(seed){
  let value = seed >>> 0;
  return () => {
    value = (value * 1664525 + 1013904223) >>> 0;
    return value / 4294967296;
  };
}

/* ============================================================

 * c = { title, subtitle, tag, ...style-specific }

const STYLES = [

{

    {key:'subtitle', label:'副标题（可选）', type:'text', default:'从供给驱动到需求驱动的产品方法论'},
    {key:'tag', label:'报告标签（1-3 个，逗号分隔）', type:'text', default:'战略路径, 组织采用, 商业兑现'}
  ],
  render(c){
    const cx = 600;
    return `<svg viewBox="0 0 1200 510" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F2F4F7"/></linearGradient>
    <linearGradient id="cr-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1B3A5C" stop-opacity="0"/><stop offset="100%" stop-color="#1B3A5C" stop-opacity="0.5"/></linearGradient>
  </defs>
  <rect width="1200" height="510" fill="url(#cr-bg)"/>
  <!-- 瑞士网格背景 -->
  <g stroke="#D8DEE6" stroke-width="0.7" opacity="0.7">
    <line x1="80" y1="88" x2="1120" y2="88"/><line x1="80" y1="160" x2="1120" y2="160"/>
    <line x1="80" y1="350" x2="1120" y2="350"/><line x1="80" y1="422" x2="1120" y2="422"/>
    <line x1="120" y1="60" x2="120" y2="450"/><line x1="360" y1="60" x2="360" y2="450"/>
    <line x1="600" y1="60" x2="600" y2="450"/><line x1="840" y1="60" x2="840" y2="450"/><line x1="1080" y1="60" x2="1080" y2="450"/>
  </g>
  <!-- 透视/路径隐喻：从核心词延伸出的战略路径 -->

  <circle cx="1090" cy="300" r="5" fill="#E07B39"/>
  <circle cx="1090" cy="300" r="9" fill="none" stroke="#E07B39" stroke-width="0.8" opacity="0.6"/>
  <circle cx="720" cy="250" r="3.5" fill="#1B3A5C" opacity="0.8"/>
  <!-- 页眉报告家具 -->

  </g>

  <g font-family="${SERIF}" font-weight="600">

  </g>
  <rect x="76" y="186" width="330" height="120" fill="none" stroke="#1B3A5C" stroke-width="1" opacity="0.5"/>
  <line x1="406" y1="186" x2="420" y2="200" stroke="#1B3A5C" stroke-width="1" opacity="0.5"/>
  <line x1="406" y1="306" x2="420" y2="292" stroke="#1B3A5C" stroke-width="1" opacity="0.5"/>
  <!-- B 层完整标题 -->
  ${fitTextBlock(c.title, {x:80,y:120,maxWidth:700,maxLines:1,fontSize:17,minFontSize:13,lineHeight:1.15,letterSpacing:1,fill:'#34465C',weight:500,extra:' data-role="title-detail"'})}
  ${fitTextBlock(c.subtitle, {x:80,y:150,maxWidth:720,maxLines:1,fontSize:14,minFontSize:11,lineHeight:1.15,letterSpacing:1,fill:'#7A8699',weight:400,extra:' data-role="subtitle"'})}
  <line x1="80" y1="134" x2="420" y2="134" stroke="#1B3A5C" stroke-width="2"/>
  <!-- 页脚家具 -->
  <line x1="80" y1="440" x2="1120" y2="440" stroke="#1B3A5C" stroke-width="0.8" opacity="0.5"/>
  <g font-size="11" fill="#7A8699" font-family="${FONT}" letter-spacing="2">
    <text x="80" y="466">${esc(c.tag.split(',')[0] || '')}</text>
    <text x="600" y="466" text-anchor="middle">${esc(c.tag.split(',')[1] || '')}</text>
    <text x="1120" y="466" text-anchor="end">${esc(c.tag.split(',')[2] || '')}</text>
  </g>
</svg>`;
  }
},

/* ============================================================
 * 2. 商业杂志头版 business-magazine-front-page
 * ============================================================ */
{
  id:'business-magazine-front-page', name:'商业杂志头版', en:'Business Magazine', group:'公众号首选', rec:true,
  fields:[

/* ============================================================
 * 应用逻辑
 * ============================================================ */
let current = STYLES[0];
let styleQuery = '';
const states = new Map();
const thumbnails = new Map();

function defaultsOf(style){
  const d = {};
  (style.fields||[]).forEach(f => { d[f.key] = f.default ?? ''; });
  return d;
}

function stateOf(style){
  if(!states.has(style.id)) states.set(style.id, defaultsOf(style));
  return states.get(style.id);
}

function scopeSvgIds(svg, prefix){
  let scoped = svg;
  const ids = [...svg.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
  ids.forEach(id => {
    const next = `${prefix}-${id}`;
    scoped = scoped.split(`id="${id}"`).join(`id="${next}"`);
    scoped = scoped.split(`url(#${id})`).join(`url(#${next})`);
    scoped = scoped.split(`href="#${id}"`).join(`href="#${next}"`);
  });
  return scoped;
}

function thumbnailOf(style){
  if(!thumbnails.has(style.id)) thumbnails.set(style.id, scopeSvgIds(style.render(defaultsOf(style)), `thumb-${style.id}`));
  return thumbnails.get(style.id);
}

let state = stateOf(current);

function renderSidebar(){
  const groups = {};
  const q = styleQuery.trim().toLocaleLowerCase('zh-CN');
  const visible = STYLES.filter(s => !q || `${s.name} ${s.en} ${s.id} ${s.group}`.toLocaleLowerCase('zh-CN').includes(q));
  visible.forEach(s => { (groups[s.group] = groups[s.group] || []).push(s); });
  const html = visible.length ? Object.entries(groups).map(([g, list]) => `
    <h2><span>${g}</span><span>${list.length}</span></h2>
    ${list.map(s => `
      <button type="button" class="style-item ${s.id === current.id ? 'active' : ''}" data-id="${s.id}" aria-pressed="${s.id === current.id}">
        <span class="style-thumb" aria-hidden="true">${thumbnailOf(s)}</span>
        <span class="style-copy">
          <span class="name">${s.rec ? '★ ' : ''}${s.name}</span>
          <span class="en">${s.en}</span>
        </span>
      </button>`).join('')}
  `).join('') : `<div class="empty-state">没有匹配风格<br>试试“极简”或“商业”</div>`;
  document.getElementById('sidebar').innerHTML = html;
  document.getElementById('style-count').textContent = q ? `${visible.length} / ${STYLES.length} 套` : `${STYLES.length} 套`;
  document.querySelectorAll('.style-item').forEach(el => {
    el.addEventListener('click', () => {
      current = STYLES.find(s => s.id === el.dataset.id);
      state = stateOf(current);
      renderSidebar(); renderEditor(); renderPreview();
    });
  });
}

function renderEditor(){
  const fields = current.fields || [];
  const html = `
    <div class="editor-head">
      <div class="eyebrow">STYLE ATOM</div>
      <h2>${current.name}</h2>
      <p>${current.rec ? '公众号优先风格' : '通用封面风格'} · 每次只使用这一套视觉语言</p>
    </div>
    <h3>文字与场景</h3>
    ${fields.map(f => {
      let control;
      const id = `field-${current.id}-${f.key}`;
      const value = String(state[f.key] || '');
      if(f.type === 'select'){
        control = `<select id="${id}" data-key="${f.key}">
          ${(f.options||[]).map(o => `<option value="${o.v}" ${state[f.key] === o.v ? 'selected' : ''}>${o.l}</option>`).join('')}
        </select>`;
      } else if(f.key === 'title' || f.key === 'subtitle'){
        control = `<textarea id="${id}" data-key="${f.key}" rows="2" placeholder="${esc(f.default || '')}">${esc(value)}</textarea>`;
      } else {
        control = `<input id="${id}" type="text" data-key="${f.key}" value="${esc(value)}" placeholder="${esc(f.default || '')}">`;
      }
      return `<div class="field"><div class="field-label"><label for="${id}">${f.label}</label>${f.type === 'text' ? `<span class="char-count" data-count-for="${f.key}">${[...value].length} 字</span>` : ''}</div>${control}${f.hint ? `<div class="hint">${f.hint}</div>` : ''}</div>`;
    }).join('')}
    <h3>导出标准</h3>
    <div class="tips"><strong>1800×766 PNG</strong><br>对应微信 900×383 的 2× 清晰图。导出会等待中文字体就绪，并保持与当前预览一致。</div>`;
  document.getElementById('editor').innerHTML = html;
  document.querySelectorAll('#editor input, #editor select, #editor textarea').forEach(el => {
    const update = () => {
      state[el.dataset.key] = el.value;
      const count = document.querySelector(`[data-count-for="${el.dataset.key}"]`);
      if(count) count.textContent = `${[...el.value].length} 字`;
      renderPreview();
    };
    el.addEventListener('input', update);
    el.addEventListener('change', update);
  });
}

function renderPreview(){
  const svg = current.render(state);
  document.getElementById('preview-frame').innerHTML = `${svg}<div class="safe-area" aria-hidden="true"></div>`;
  document.getElementById('preview-title').textContent = current.name;
  document.getElementById('style-meta').innerHTML =
    `<span class="badge">${current.en}</span><span class="badge">${current.rec ? '公众号首选' : '通用适配'}</span><span class="badge">1200×510</span>`;
}

/* 导出 PNG */
async function exportCoverPng(){
  const button = document.getElementById('btn-export');
  button.disabled = true;
  button.textContent = '正在导出…';
  try {
    await (document.fonts && document.fonts.ready);
    const svgStr = current.render(state);
    const canvas = document.createElement('canvas');
    canvas.width = 1800;
    canvas.height = 766;
    const ctx = canvas.getContext('2d');
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    const out = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if(!out) throw new Error('浏览器未能生成 PNG');
    const link = document.createElement('a');
    const safe = (state.title||'cover').replace(/[<>:"/\\|?*\x00-\x1F\s]/g,'-').slice(0,24);
    link.href = URL.createObjectURL(out);
    link.download = `punk-cover-${current.id}-${safe}.png`;
    link.click();
    URL.revokeObjectURL(link.href);
  } catch(err){
    alert('导出失败：' + err.message);
  } finally {
    button.disabled = false;
    button.textContent = '导出 2× PNG';
  }
}

document.getElementById('btn-export').addEventListener('click', exportCoverPng);
document.getElementById('btn-reset').addEventListener('click', () => {
  state = defaultsOf(current);
  states.set(current.id, state);
  renderEditor(); renderPreview();
});
document.getElementById('style-search').addEventListener('input', event => {
  styleQuery = event.target.value;
  renderSidebar();
});
document.getElementById('btn-safe-area').addEventListener('click', event => {
  const enabled = event.currentTarget.getAttribute('aria-pressed') !== 'true';
  event.currentTarget.setAttribute('aria-pressed', String(enabled));
  document.getElementById('preview-frame').classList.toggle('show-safe-area', enabled);
});

// 初始化
renderSidebar(); renderEditor(); renderPreview();
</script>
